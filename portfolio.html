<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<title>Portfolio — George Denver</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

<meta
  name="description"
  content="Portfolio of paintings and artwork by George Denver."
/>

<link rel="icon" type="image/png" href="logo.png" />

<link
  href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
  rel="stylesheet"
/>

<style>

/* =========================
   BASE
========================= */

html {
  background: #f7f7f5;
}

body {
  margin: 0;
  padding-top: 5.5rem;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.012) 0px,
      rgba(0,0,0,0.012) 1px,
      transparent 1px,
      transparent 3px
    ),
    #f7f7f5;
  color: #111;
  font-family: "Courier Prime", monospace;
}


/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 5.5rem;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 2rem;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.012) 0px,
      rgba(0,0,0,0.012) 1px,
      transparent 1px,
      transparent 3px
    ),
    #f7f7f5;

  border-bottom: 1px solid #111;

  z-index: 100;
}


/* WORDMARK */

.logo {
  font-size: 2rem;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
}


/* NAV */

nav {
  display: flex;
  align-items: center;
  gap: 2rem;
}

nav a {
  color: #111;
  text-decoration: none;
  font-size: 0.85rem;
  text-transform: uppercase;
  white-space: nowrap;
}

nav a:hover,
nav a.current {
  text-decoration: underline;
  text-underline-offset: 3px;
}


/* INSTAGRAM */

.instagram-icon {
  width: 58px;
  margin-left: -1rem;

  display: flex;
  align-items: center;
  justify-content: center;
}

.instagram-icon svg {
  width: 16px;
  height: 16px;
}


/* =========================
   PAGE TITLE
========================= */

.page-intro {
  padding: 3rem 2rem 2rem;
}

.page-intro h1 {
  margin: 0;
  font-size: 2rem;
  font-weight: 400;
  text-transform: uppercase;
}


/* =========================
   PORTFOLIO CAROUSEL
========================= */

.portfolio-wrapper {
  position: relative;
  width: 100%;
  box-sizing: border-box;

  overflow: hidden;

  padding: 1rem 5rem 4rem;
}


/* ARTWORK ROW */

.portfolio {
  display: flex;
  flex-direction: row;

  gap: 2rem;

  width: max-content;

  transition: transform 0.45s ease;
}


/* INDIVIDUAL ARTWORK */

.work {
  flex: 0 0 auto;

  width: 42vw;
  max-width: 600px;
  min-width: 320px;

  cursor: pointer;
}

.work img {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;
}


/* ARTWORK INFORMATION */

.work-info {
  margin-top: 0.75rem;
}

.work-title {
  margin: 0;

  font-size: 0.9rem;
  line-height: 1.3;
}

.work-year {
  margin: 0.2rem 0 0;

  font-size: 0.8rem;
}


/* =========================
   CAROUSEL ARROWS
========================= */

.portfolio-arrow {
  position: absolute;

  /*
    The arrows are centred against the artwork area.
    The wrapper has 1rem of top padding, so we offset
    the centre accordingly.
  */
  top: calc(50% - 1.5rem);

  transform: translateY(-50%);

  width: 3rem;
  height: 3rem;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  background: #f7f7f5;

  border: none;

  color: #111;

  font-family: "Courier Prime", monospace;
  font-size: 2.5rem;
  line-height: 1;

  cursor: pointer;

  z-index: 10;
}

.portfolio-arrow.left {
  left: 1rem;
}

.portfolio-arrow.right {
  right: 1rem;
}

.portfolio-arrow:hover {
  text-decoration: underline;
  text-underline-offset: 4px;
}

.portfolio-arrow:disabled {
  opacity: 0.25;
  cursor: default;
  text-decoration: none;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox {
  position: fixed;

  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(247,247,245,0.96);

  z-index: 1000;
}

.lightbox.active {
  display: flex;
}


/* LIGHTBOX IMAGE */

.lightbox img {
  max-width: 85vw;
  max-height: 85vh;

  width: auto;
  height: auto;

  object-fit: contain;
}


/* LIGHTBOX CLOSE */

.lightbox-close {
  position: absolute;

  top: 1.5rem;
  right: 2rem;

  border: none;
  background: none;

  font-family: "Courier Prime", monospace;
  font-size: 2rem;

  color: #111;

  cursor: pointer;
}


/* LIGHTBOX ARROWS */

.lightbox-arrow {
  position: absolute;

  top: 50%;
  transform: translateY(-50%);

  border: none;
  background: none;

  font-family: "Courier Prime", monospace;
  font-size: 3rem;

  color: #111;

  cursor: pointer;
}

.lightbox-arrow.left {
  left: 2rem;
}

.lightbox-arrow.right {
  right: 2rem;
}


/* =========================
   FOOTER
========================= */

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 2rem;

  border-top: 1px solid #111;

  font-size: 0.75rem;
}

footer a {
  color: #111;
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: auto;
    min-height: 5.5rem;

    padding: 1.25rem;

    align-items: flex-start;
  }

  .logo {
    font-size: 1.5rem;
  }

  nav {
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  nav a {
    font-size: 0.7rem;
  }

  .instagram-icon {
    width: auto;
    margin-left: 0.25rem;
  }

  .page-intro {
    padding: 2rem 1.25rem 1rem;
  }

  .page-intro h1 {
    font-size: 1.5rem;
  }

  .portfolio-wrapper {
    padding: 1rem 3.5rem 3rem;
  }

  .portfolio {
    gap: 1.25rem;
  }

  .work {
    width: 78vw;
    min-width: 78vw;
  }

  .portfolio-arrow {
    width: 2.5rem;
    height: 2.5rem;

    font-size: 2rem;
  }

  .portfolio-arrow.left {
    left: 0.5rem;
  }

  .portfolio-arrow.right {
    right: 0.5rem;
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 80vh;
  }

  .lightbox-arrow {
    font-size: 2.5rem;
  }

  .lightbox-arrow.left {
    left: 0.5rem;
  }

  .lightbox-arrow.right {
    right: 0.5rem;
  }

  footer {
    padding: 1.5rem 1.25rem;

    flex-direction: column;
    align-items: flex-start;

    gap: 0.75rem;
  }

}


/* =========================
   HIDE SCROLLBARS
========================= */

.portfolio-wrapper::-webkit-scrollbar {
  display: none;
}

.portfolio-wrapper {
  scrollbar-width: none;
}

</style>

</head>


<body>

<script>

/* =========================
   PORTFOLIO CAROUSEL
========================= */

const portfolio =
  document.getElementById("portfolio");

const portfolioPrev =
  document.getElementById("portfolioPrev");

const portfolioNext =
  document.getElementById("portfolioNext");

const portfolioWorks =
  Array.from(document.querySelectorAll(".work"));

let portfolioPosition = 0;


/* GET WIDTH OF ONE ARTWORK + GAP */

function getPortfolioStep() {

  if (!portfolioWorks.length) {
    return 0;
  }

  const work =
    portfolioWorks[0];

  const gap =
    parseFloat(
      getComputedStyle(portfolio).gap
    ) || 0;

  return work.offsetWidth + gap;
}


/* UPDATE ARROWS */

function updatePortfolioArrows() {

  const wrapper =
    document.querySelector(".portfolio-wrapper");

  const maxPosition =
    Math.max(
      0,
      portfolio.scrollWidth -
      wrapper.clientWidth +
      160
    );

  portfolioPrev.disabled =
    portfolioPosition <= 0;

  portfolioNext.disabled =
    portfolioPosition >= maxPosition - 2;
}


/* NEXT */

portfolioNext.addEventListener(
  "click",
  () => {

    const step =
      getPortfolioStep();

    const wrapper =
      document.querySelector(".portfolio-wrapper");

    const maxPosition =
      Math.max(
        0,
        portfolio.scrollWidth -
        wrapper.clientWidth +
        160
      );

    portfolioPosition =
      Math.min(
        portfolioPosition + step,
        maxPosition
      );

    portfolio.style.transform =
      `translateX(-${portfolioPosition}px)`;

    updatePortfolioArrows();

  }
);


/* PREVIOUS */

portfolioPrev.addEventListener(
  "click",
  () => {

    const step =
      getPortfolioStep();

    portfolioPosition =
      Math.max(
        portfolioPosition - step,
        0
      );

    portfolio.style.transform =
      `translateX(-${portfolioPosition}px)`;

    updatePortfolioArrows();

  }
);


/* RESET ON RESIZE */

window.addEventListener(
  "resize",
  () => {

    portfolioPosition = 0;

    portfolio.style.transform =
      "translateX(0)";

    updatePortfolioArrows();

  }
);


/* INITIAL STATE */

window.addEventListener(
  "load",
  updatePortfolioArrows
);


/* =========================
   LIGHTBOX
========================= */

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxClose =
  document.getElementById("lightboxClose");

const lightboxPrev =
  document.getElementById("lightboxPrev");

const lightboxNext =
  document.getElementById("lightboxNext");

let currentIndex = 0;


/* OPEN LIGHTBOX */

function openLightbox(index) {

  currentIndex = index;

  const work =
    portfolioWorks[currentIndex];

  const image =
    work.querySelector("img");

  lightboxImage.src =
    image.src;

  lightboxImage.alt =
    image.alt;

  lightbox.classList.add("active");

  lightbox.setAttribute(
    "aria-hidden",
    "false"
  );

}


/* CLOSE LIGHTBOX */

function closeLightbox() {

  lightbox.classList.remove("active");

  lightbox.setAttribute(
    "aria-hidden",
    "true"
  );

}


/* NEXT LIGHTBOX IMAGE */

function showNext() {

  currentIndex =
    (currentIndex + 1) %
    portfolioWorks.length;

  openLightbox(currentIndex);

}


/* PREVIOUS LIGHTBOX IMAGE */

function showPrevious() {

  currentIndex =
    (currentIndex - 1 +
    portfolioWorks.length) %
    portfolioWorks.length;

  openLightbox(currentIndex);

}


/* CLICK ARTWORK */

portfolioWorks.forEach(
  (work, index) => {

    work.addEventListener(
      "click",
      () => openLightbox(index)
    );

  }
);


/* LIGHTBOX CONTROLS */

lightboxClose.addEventListener(
  "click",
  closeLightbox
);

lightboxNext.addEventListener(
  "click",
  showNext
);

lightboxPrev.addEventListener(
  "click",
  showPrevious
);


/* CLOSE WHEN CLICKING BACKGROUND */

lightbox.addEventListener(
  "click",
  (event) => {

    if (event.target === lightbox) {
      closeLightbox();
    }

  }
);


/* KEYBOARD */

document.addEventListener(
  "keydown",
  (event) => {

    if (
      !lightbox.classList.contains("active")
    ) {
      return;
    }

    if (event.key === "Escape") {
      closeLightbox();
    }

    if (event.key === "ArrowRight") {
      showNext();
    }

    if (event.key === "ArrowLeft") {
      showPrevious();
    }

  }
);


/* MOBILE SWIPE */

let touchStartX = 0;

lightbox.addEventListener(
  "touchstart",
  (event) => {

    touchStartX =
      event.changedTouches[0].screenX;

  }
);

lightbox.addEventListener(
  "touchend",
  (event) => {

    const touchEndX =
      event.changedTouches[0].screenX;

    const difference =
      touchStartX - touchEndX;

    if (Math.abs(difference) < 50) {
      return;
    }

    if (difference > 0) {
      showNext();
    } else {
      showPrevious();
    }

  }
);

</script>
