<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<title>Portfolio — George Denver</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"

<meta
  name="description"
  content="Portfolio of paintings and works by George Denver."
/>

<link rel="icon" type="image/png" href="logo.png" />

<style>

/* =========================
   BASE
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  padding-top: 5.5rem;
  background: #f7f7f5;
  color: #111;
  font-family: "Courier Prime", monospace;

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.018) 0px,
      rgba(0,0,0,0.018) 1px,
      transparent 1px,
      transparent 4px
    );
}


/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 5.5rem;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 2rem;

  background: #f7f7f5;

  border-bottom: 1px solid #111;

  z-index: 1000;
}

.wordmark {
  font-size: 2rem;
  text-transform: uppercase;
  line-height: 1;
}

nav {
  display: flex;
  align-items: center;
  gap: 1.6rem;
}

nav a {
  color: #111;
  text-decoration: none;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

nav a:hover {
  text-decoration: underline;
}

nav a.current {
  text-decoration: underline;
}

.instagram-icon {
  width: 58px;
  display: flex;
  justify-content: flex-end;
  margin-left: -1rem;
}

.instagram-icon svg {
  width: 16px;
  height: 16px;
}


/* =========================
   PAGE INTRO
========================= */

.page-intro {
  padding: 3rem 2rem 2rem;
}

.page-intro h1 {
  margin: 0;
  font-size: 2rem;
  font-weight: 400;
}


/* =========================
   HORIZONTAL PORTFOLIO
========================= */

.portfolio-wrapper {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;

  padding: 1rem 2rem 4rem;

  scrollbar-width: thin;
  scrollbar-color: #111 transparent;

  -webkit-overflow-scrolling: touch;
}

.portfolio {
  display: flex;
  flex-direction: row;
  gap: 2rem;

  width: max-content;
}

.work {
  flex: 0 0 auto;

  width: 42vw;
  max-width: 600px;
  min-width: 320px;

  cursor: pointer;
}

.work img {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(247,247,245,0.96);

  z-index: 2000;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 85vw;
  max-height: 85vh;

  width: auto;
  height: auto;

  object-fit: contain;
}


/* CLOSE */

.lightbox-close {
  position: absolute;

  top: 1.5rem;
  right: 2rem;

  font-size: 2rem;
  line-height: 1;

  cursor: pointer;
}


/* ARROWS */

.lightbox-arrow {
  position: absolute;

  top: 50%;
  transform: translateY(-50%);

  font-size: 2.5rem;
  line-height: 1;

  cursor: pointer;

  user-select: none;
}

.lightbox-prev {
  left: 2rem;
}

.lightbox-next {
  right: 2rem;
}


/* =========================
   FOOTER
========================= */

footer {
  border-top: 1px solid #111;

  padding: 1.5rem 2rem;

  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 0.75rem;
}

footer a {
  color: #111;
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    height: auto;
    min-height: 5rem;

    padding: 1.2rem 1rem;

    align-items: flex-start;
  }

  .wordmark {
    font-size: 1.5rem;
  }

  nav {
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  nav a {
    font-size: 0.7rem;
  }

  .instagram-icon {
    width: auto;
    margin-left: 0;
  }

  body {
    padding-top: 5.5rem;
  }

  .page-intro {
    padding: 2rem 1rem 1rem;
  }

  .page-intro h1 {
    font-size: 1.6rem;
  }

  .portfolio-wrapper {
    padding: 1rem 1rem 3rem;
  }

  .portfolio {
    gap: 1rem;
  }

  .work {
    width: 78vw;
    min-width: 78vw;
  }

  .lightbox img {
    max-width: 92vw;
    max-height: 85vh;
  }

  .lightbox-prev {
    left: 1rem;
  }

  .lightbox-next {
    right: 1rem;
  }

  footer {
    padding: 1.2rem 1rem;

    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
}

</style>

</head>


<body>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const works = Array.from(
  document.querySelectorAll(".work")
);

const lightbox = document.getElementById(
  "lightbox"
);

const lightboxImage = document.getElementById(
  "lightboxImage"
);

const closeButton = document.getElementById(
  "lightboxClose"
);

const prevButton = document.getElementById(
  "lightboxPrev"
);

const nextButton = document.getElementById(
  "lightboxNext"
);

let currentIndex = 0;


/* OPEN */

function openLightbox(index) {

  currentIndex = index;

  const image =
    works[currentIndex].querySelector("img");

  lightboxImage.src = image.src;
  lightboxImage.alt = image.alt;

  lightbox.classList.add("active");

  lightbox.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow = "hidden";
}


/* CLOSE */

function closeLightbox() {

  lightbox.classList.remove("active");

  lightbox.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.style.overflow = "";
}


/* NEXT */

function showNext() {

  currentIndex =
    (currentIndex + 1) % works.length;

  const image =
    works[currentIndex].querySelector("img");

  lightboxImage.src = image.src;
  lightboxImage.alt = image.alt;
}


/* PREVIOUS */

function showPrevious() {

  currentIndex =
    (currentIndex - 1 + works.length)
    % works.length;

  const image =
    works[currentIndex].querySelector("img");

  lightboxImage.src = image.src;
  lightboxImage.alt = image.alt;
}


/* CLICK ARTWORK */

works.forEach((work, index) => {

  work.addEventListener(
    "click",
    () => openLightbox(index)
  );

});


/* BUTTONS */

closeButton.addEventListener(
  "click",
  closeLightbox
);

nextButton.addEventListener(
  "click",
  showNext
);

prevButton.addEventListener(
  "click",
  showPrevious
);


/* BACKGROUND CLICK */

lightbox.addEventListener(
  "click",
  (event) => {

    if (event.target === lightbox) {
      closeLightbox();
    }

  }
);


/* KEYBOARD */

document.addEventListener(
  "keydown",
  (event) => {

    if (!lightbox.classList.contains("active")) {
      return;
    }

    if (event.key === "Escape") {
      closeLightbox();
    }

    if (event.key === "ArrowRight") {
      showNext();
    }

    if (event.key === "ArrowLeft") {
      showPrevious();
    }

  }
);


/* MOBILE SWIPE */

let touchStartX = 0;

lightbox.addEventListener(
  "touchstart",
  (event) => {

    touchStartX =
      event.changedTouches[0].screenX;

  },
  { passive: true }
);


lightbox.addEventListener(
  "touchend",
  (event) => {

    const touchEndX =
      event.changedTouches[0].screenX;

    const distance =
      touchEndX - touchStartX;

    if (Math.abs(distance) < 50) {
      return;
    }

    if (distance < 0) {
      showNext();
    } else {
      showPrevious();
    }

  },
  { passive: true }
);

</script>
