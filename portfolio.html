<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<title>Portfolio — George Denver</title>

<link rel="icon" type="image/png" href="logo.png" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

<meta
  name="description"
  content="Portfolio of paintings and artwork by George Denver."
/>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"

<style>

:root{
  --paper:#f7f7f5;
  --ink:#000000;
  --line:#000000;
}

/* ---------- Base ---------- */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  background:var(--paper);
}

body{
  margin:0;
  padding-top:5.5rem;
  min-height:100vh;

  background-color:var(--paper);

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.018) 0px,
      rgba(0,0,0,0.018) 1px,
      transparent 1px,
      transparent 3px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.012) 0px,
      rgba(0,0,0,0.012) 1px,
      transparent 1px,
      transparent 4px
    );

  color:var(--ink);
  font-family:'Courier Prime', monospace;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Header ---------- */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:1.6rem clamp(1.2rem, 4vw, 3rem);

  background-color:var(--paper);

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.018) 0px,
      rgba(0,0,0,0.018) 1px,
      transparent 1px,
      transparent 3px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.012) 0px,
      rgba(0,0,0,0.012) 1px,
      transparent 1px,
      transparent 4px
    );

  border-bottom:1px solid var(--line);
}

.wordmark{
  font-family:'Courier Prime', monospace;
  font-weight:400;
  color:#000;
  text-transform:uppercase;
  letter-spacing:0.03em;
  font-size:2rem;
  text-decoration:none;
}

.wordmark span{
  color:#000;
  font-style:normal;
}

/* ---------- Navigation ---------- */

nav{
  display:flex;
  align-items:center;
  gap:clamp(1rem, 3vw, 2.2rem);
}

nav a{
  text-decoration:none;
  font-family:'Courier Prime', monospace;
  font-size:0.85rem;
  font-weight:400;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:#000;
  position:relative;
  padding-bottom:2px;
}

nav a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-3px;
  width:0;
  height:1px;
  background:#000;
  transition:width 0.25s ease;
}

nav a:hover::after{
  width:100%;
}

nav a.current::after{
  width:100%;
}

/* ---------- Instagram ---------- */

.instagram-icon{
  display:flex;
  align-items:center;
  justify-content:center;

  width:58px;
  height:18px;

  padding:0;
  margin-left:-1rem;

  transform:translateY(-2px);
}

.instagram-icon::after{
  display:none !important;
}

.instagram-icon svg{
  width:16px;
  height:16px;
  stroke:#000;
  fill:none;
  stroke-width:1.6;
}

.instagram-icon:hover svg{
  opacity:0.5;
}

/* ---------- Page Title ---------- */

.page-intro{
  padding:3rem clamp(1.2rem, 4vw, 3rem) 2rem;
}

.page-intro h1{
  margin:0;

  font-family:'Courier Prime', monospace;
  font-size:2rem;
  font-weight:400;

  text-transform:uppercase;
}

/* ---------- Portfolio ---------- */

.portfolio-wrapper{
  position:relative;

  width:100%;

  overflow:hidden;

  padding:1rem 5rem 4rem;
}

.portfolio{
  display:flex;
  flex-direction:row;

  gap:2rem;

  width:max-content;

  transition:transform 0.45s ease;
}

.work{
  flex:0 0 auto;

  width:42vw;
  max-width:600px;
  min-width:320px;

  cursor:pointer;
}

.work img{
  display:block;

  width:100%;
  height:auto;

  object-fit:contain;
}

.work-info{
  margin-top:0.75rem;
}

.work-title{
  margin:0;

  font-size:0.9rem;
  line-height:1.3;
}

.work-year{
  margin:0.2rem 0 0;

  font-size:0.8rem;
}

/* ---------- Portfolio Arrows ---------- */

.portfolio-arrow{
  position:absolute;

  top:calc(50% - 1.5rem);

  transform:translateY(-50%);

  width:3rem;
  height:3rem;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  background:var(--paper);

  border:none;

  color:#000;

  font-family:'Courier Prime', monospace;
  font-size:2.5rem;
  line-height:1;

  cursor:pointer;

  z-index:10;
}

.portfolio-arrow.left{
  left:1rem;
}

.portfolio-arrow.right{
  right:1rem;
}

.portfolio-arrow:hover{
  text-decoration:underline;
  text-underline-offset:4px;
}

.portfolio-arrow:disabled{
  opacity:0.25;
  cursor:default;
  text-decoration:none;
}

/* ---------- Lightbox ---------- */

.lightbox{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(247,247,245,0.96);

  z-index:2000;
}

.lightbox.active{
  display:flex;
}

.lightbox img{
  max-width:85vw;
  max-height:85vh;

  width:auto;
  height:auto;

  object-fit:contain;
}

.lightbox-close{
  position:absolute;

  top:1.5rem;
  right:2rem;

  border:none;
  background:none;

  font-family:'Courier Prime', monospace;
  font-size:2rem;

  color:#000;

  cursor:pointer;
}

.lightbox-arrow{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  border:none;
  background:none;

  font-family:'Courier Prime', monospace;
  font-size:3rem;

  color:#000;

  cursor:pointer;
}

.lightbox-arrow.left{
  left:2rem;
}

.lightbox-arrow.right{
  right:2rem;
}

/* ---------- Footer ---------- */

footer{
  border-top:1px solid #000;

  padding:2rem clamp(1.2rem, 4vw, 3rem);

  display:flex;
  flex-wrap:wrap;

  gap:0.6rem 2rem;

  justify-content:space-between;

  font-size:0.82rem;

  color:#000;

  letter-spacing:0.02em;
}

footer a{
  color:#000;
  text-decoration:none;
}

footer a:visited{
  color:#000;
}

footer a:hover{
  color:#000;
}

/* ---------- Mobile ---------- */

@media(max-width:700px){

  header{
    flex-wrap:wrap;
    gap:0.9rem;
  }

  nav{
    gap:1rem;
    flex-wrap:wrap;
  }

  nav a{
    font-size:0.7rem;
  }

  .page-intro{
    padding:2rem 1.25rem 1rem;
  }

  .page-intro h1{
    font-size:1.5rem;
  }

  .portfolio-wrapper{
    padding:1rem 3.5rem 3rem;
  }

  .portfolio{
    gap:1.25rem;
  }

  .work{
    width:78vw;
    min-width:78vw;
  }

  .portfolio-arrow{
    width:2.5rem;
    height:2.5rem;
    font-size:2rem;
  }

  .portfolio-arrow.left{
    left:0.5rem;
  }

  .portfolio-arrow.right{
    right:0.5rem;
  }

  .lightbox img{
    max-width:90vw;
    max-height:80vh;
  }

  .lightbox-arrow{
    font-size:2.5rem;
  }

  .lightbox-arrow.left{
    left:0.5rem;
  }

  .lightbox-arrow.right{
    right:0.5rem;
  }

  footer{
    padding:1.5rem 1.25rem;

    flex-direction:column;

    align-items:flex-start;

    gap:0.75rem;
  }

}

/* ---------- Hide Scrollbars ---------- */

.portfolio-wrapper::-webkit-scrollbar{
  display:none;
}

.portfolio-wrapper{
  scrollbar-width:none;
}

</style>

</head>

<script>

/* ---------- Portfolio Carousel ---------- */

const portfolio =
  document.getElementById("portfolio");

const portfolioPrev =
  document.getElementById("portfolioPrev");

const portfolioNext =
  document.getElementById("portfolioNext");

const portfolioWorks =
  Array.from(document.querySelectorAll(".work"));

let portfolioPosition = 0;


function getPortfolioStep(){

  if(!portfolioWorks.length){
    return 0;
  }

  const work =
    portfolioWorks[0];

  const gap =
    parseFloat(
      getComputedStyle(portfolio).gap
    ) || 0;

  return work.offsetWidth + gap;

}


function updatePortfolioArrows(){

  const wrapper =
    document.querySelector(".portfolio-wrapper");

  const maxPosition =
    Math.max(
      0,
      portfolio.scrollWidth -
      wrapper.clientWidth +
      160
    );

  portfolioPrev.disabled =
    portfolioPosition <= 0;

  portfolioNext.disabled =
    portfolioPosition >= maxPosition - 2;

}


portfolioNext.addEventListener(
  "click",
  () => {

    const step =
      getPortfolioStep();

    const wrapper =
      document.querySelector(".portfolio-wrapper");

    const maxPosition =
      Math.max(
        0,
        portfolio.scrollWidth -
        wrapper.clientWidth +
        160
      );

    portfolioPosition =
      Math.min(
        portfolioPosition + step,
        maxPosition
      );

    portfolio.style.transform =
      `translateX(-${portfolioPosition}px)`;

    updatePortfolioArrows();

  }
);


portfolioPrev.addEventListener(
  "click",
  () => {

    const step =
      getPortfolioStep();

    portfolioPosition =
      Math.max(
        portfolioPosition - step,
        0
      );

    portfolio.style.transform =
      `translateX(-${portfolioPosition}px)`;

    updatePortfolioArrows();

  }
);


window.addEventListener(
  "resize",
  () => {

    portfolioPosition = 0;

    portfolio.style.transform =
      "translateX(0)";

    updatePortfolioArrows();

  }
);


window.addEventListener(
  "load",
  updatePortfolioArrows
);


/* ---------- Lightbox ---------- */

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxClose =
  document.getElementById("lightboxClose");

const lightboxPrev =
  document.getElementById("lightboxPrev");

const lightboxNext =
  document.getElementById("lightboxNext");

let currentIndex = 0;


function openLightbox(index){

  currentIndex = index;

  const work =
    portfolioWorks[currentIndex];

  const image =
    work.querySelector("img");

  lightboxImage.src =
    image.src;

  lightboxImage.alt =
    image.alt;

  lightbox.classList.add("active");

  lightbox.setAttribute(
    "aria-hidden",
    "false"
  );

}


function closeLightbox(){

  lightbox.classList.remove("active");

  lightbox.setAttribute(
    "aria-hidden",
    "true"
  );

}


function showNext(){

  currentIndex =
    (currentIndex + 1) %
    portfolioWorks.length;

  openLightbox(currentIndex);

}


function showPrevious(){

  currentIndex =
    (currentIndex - 1 +
    portfolioWorks.length) %
    portfolioWorks.length;

  openLightbox(currentIndex);

}


/* Artwork Click */

portfolioWorks.forEach(
  (work,index) => {

    work.addEventListener(
      "click",
      () => openLightbox(index)
    );

  }
);


/* Lightbox Controls */

lightboxClose.addEventListener(
  "click",
  closeLightbox
);

lightboxNext.addEventListener(
  "click",
  showNext
);

lightboxPrev.addEventListener(
  "click",
  showPrevious
);


/* Click Outside Image */

lightbox.addEventListener(
  "click",
  (event) => {

    if(event.target === lightbox){
      closeLightbox();
    }

  }
);


/* Keyboard Controls */

document.addEventListener(
  "keydown",
  (event) => {

    if(!lightbox.classList.contains("active")){
      return;
    }

    if(event.key === "Escape"){
      closeLightbox();
    }

    if(event.key === "ArrowRight"){
      showNext();
    }

    if(event.key === "ArrowLeft"){
      showPrevious();
    }

  }
);


/* Mobile Swipe */

let touchStartX = 0;


lightbox.addEventListener(
  "touchstart",
  (event) => {

    touchStartX =
      event.changedTouches[0].screenX;

  }
);


lightbox.addEventListener(
  "touchend",
  (event) => {

    const touchEndX =
      event.changedTouches[0].screenX;

    const difference =
      touchStartX - touchEndX;

    if(Math.abs(difference) < 50){
      return;
    }

    if(difference > 0){
      showNext();
    }else{
      showPrevious();
    }

  }
);

</script>
