<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<title>Contact — George Denver</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"

<meta

/>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link

  rel="stylesheet"

<style>

  :root{
    --paper:#ffffff;
    --ink:#000000;
    --line:#000000;
  }

  *{
    box-sizing:border-box;
  }

  html{
    scroll-behavior:smooth;
  }

  /* ---------- Body ---------- */

  body{
    margin:0;
    padding-top:5.5rem;
    min-height:100vh;

    background-color:#f7f7f5;

    background-image:
      repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.018) 0px,
        rgba(0,0,0,0.018) 1px,
        transparent 1px,
        transparent 3px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.012) 0px,
        rgba(0,0,0,0.012) 1px,
        transparent 1px,
        transparent 4px
      );

    color:var(--ink);

    font-family:'Courier Prime', system-ui, sans-serif;

    -webkit-font-smoothing:antialiased;
  }


  /* ---------- Header ---------- */

  header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:1.6rem clamp(1.2rem, 4vw, 3rem);

    background-color:#f7f7f5;

    background-image:
      repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.018) 0px,
        rgba(0,0,0,0.018) 1px,
        transparent 1px,
        transparent 3px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.012) 0px,
        rgba(0,0,0,0.012) 1px,
        transparent 1px,
        transparent 4px
      );

    border-bottom:1px solid var(--line);
  }


  /* ---------- Wordmark ---------- */

  .wordmark{
    font-family:'Courier Prime', monospace;
    font-weight:400;

    color:#000000;

    text-transform:uppercase;
    letter-spacing:0.03em;

    font-size:2rem;

    text-decoration:none;
  }

  .wordmark,
  .wordmark:visited,
  .wordmark:hover,
  .wordmark:active,
  .wordmark span{
    color:#000000 !important;
    text-decoration:none;
  }


  /* ---------- Navigation ---------- */

  nav{
    display:flex;
    align-items:center;

    gap:clamp(1rem, 3vw, 2.2rem);
  }

  nav a{
    text-decoration:none;

    font-family:'Courier Prime', monospace;

    font-size:0.85rem;
    font-weight:400;

    letter-spacing:0.06em;

    text-transform:uppercase;

    color:var(--ink);

    position:relative;

    padding-bottom:2px;
  }


  nav a::after{
    content:'';

    position:absolute;

    left:0;
    bottom:-3px;

    width:0;
    height:1px;

    background:#000000;

    transition:width 0.25s ease;
  }


  nav a:hover::after{
    width:100%;
  }


  nav a.current::after{
    width:100%;
  }


  /* ---------- Instagram ---------- */

  .instagram-icon{
    display:flex;
    align-items:center;
    justify-content:center;

    width:58px;
    height:18px;

    padding:0;

    margin-left:-1rem;

    transform:translateY(-2px);
  }


  .instagram-icon::after{
    display:none !important;
  }


  .instagram-icon svg{
    width:16px;
    height:16px;

    stroke:#000000;

    fill:none;

    stroke-width:1.6;
  }


  .instagram-icon:hover svg{
    opacity:0.5;
  }


  /* ---------- Contact ---------- */

  .contact{

    min-height:calc(100vh - 90px);

    display:flex;

    align-items:center;

    padding:
      clamp(3rem, 7vw, 6rem)
      clamp(1.5rem, 12vw, 12rem);
  }


  .contact-content{

    width:100%;

    max-width:520px;
  }


  .contact h1{

    font-family:'Courier Prime', monospace;

    font-weight:400;

    font-size:clamp(2rem, 4vw, 3rem);

    line-height:1.1;

    margin:0 0 2.5rem;
  }


  .contact p{

    font-size:0.95rem;

    line-height:1.8;

    margin:0 0 1.5rem;

    max-width:500px;
  }


  .contact a{

    color:#000000;

    text-decoration:none;

    border-bottom:1px solid #000000;

    padding-bottom:2px;

    transition:opacity 0.2s ease;
  }


  .contact a:hover{

    opacity:0.5;
  }


  /* ---------- Footer ---------- */

  footer{

    border-top:1px solid var(--line);

    padding:2rem clamp(1.2rem, 4vw, 3rem);

    display:flex;

    flex-wrap:wrap;

    gap:0.6rem 2rem;

    justify-content:space-between;

    font-size:0.82rem;

    color:var(--ink);

    letter-spacing:0.02em;
  }


  footer a{

    color:#000000;

    text-decoration:none;
  }


  footer a:visited{

    color:#000000;
  }


  footer a:hover{

    color:#000000;
  }


  /* ---------- Mobile ---------- */

  @media (max-width:640px){

    header{

      flex-wrap:wrap;

      gap:0.9rem;
    }


    nav{

      gap:1rem;

      flex-wrap:wrap;
    }


    .contact{

      min-height:calc(100vh - 90px);

      padding:3rem 1.5rem 4rem;

      align-items:center;
    }


    .contact-content{

      max-width:520px;
    }


    .contact h1{

      font-size:2.2rem;

      margin-bottom:2rem;
    }


    .contact p{

      font-size:0.9rem;

      line-height:1.8;
    }

  }


  /* ---------- Reduced Motion ---------- */

  @media (prefers-reduced-motion:reduce){

    html{

      scroll-behavior:auto;
    }

    nav a::after{

      transition:none;
    }

  }

</style>

</head>
