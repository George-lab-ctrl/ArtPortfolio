<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>George Denver — Painter</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="George Denver is a painter based in Kent, UK. Original artwork, commissions, and gallery works." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap"
  rel="stylesheet"
>


<style>
  :root{
    --paper:      #ffffff;
    --ink:        #000000;
    --ink-soft:   #000000;
    --line:       #000000;
    --ochre:      #000000;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    padding-top: 5.5rem;
    background:var(--paper);
    color:var(--ink);
    font-family:'Courier Prime', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  /* ---------- Header ---------- */
 header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:1.6rem clamp(1.2rem, 4vw, 3rem);

  background:var(--paper);
  border-bottom:1px solid var(--line);
}

  .wordmark{
  font-family:'Courier Prime', monospace;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:0.03em;
  font-size:2.0rem;
  text-decoration:none;

  }

  .wordmark span{
    color:var(--ink);
    font-style:normal;
  }

  nav{
  display:flex;
  align-items:center;
  gap:clamp(1rem, 3vw, 2.2rem);
}

  nav a{
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    position:relative;
    padding-bottom:2px;
  }

  nav a::after{
    content:'';
    position:absolute;
    left:0; bottom:-3px;
    width:0; height:1px;
    background:var(--ochre);
    transition:width 0.25s ease;
  }

  nav a:hover{ color:var(--ink); }
  nav a:hover::after{ width:100%; }

.instagram-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:58px;
  height:18px;
  padding:0;
  margin-left:-1rem;
  transform:translateY(-2px);
}

.instagram-icon::after{
  display:none !important;
}

.instagram-icon svg{
  width:16px;
  height:16px;
  stroke:#000000;
  fill:none;
  stroke-width:1.6;
}

.instagram-icon:hover svg{
  opacity:0.5;
}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    margin:clamp(1.2rem, 4vw, 2.4rem);
    height:78vh;
    min-height:420px;
    overflow:hidden;
    background:
      linear-gradient(160deg, #d8cfbc 0%, #c2a98a 45%, #8f6a4a 100%);
    background-image: url('landingimage.JPG'), linear-gradient(160deg, #d8cfbc 0%, #c2a98a 45%, #8f6a4a 100%);
    background-size: cover;
    background-position: 70% center;
  }

 .hero-caption{
    position:absolute;

    left:8%;
    top:48%;

    transform:rotate(-7deg);

    max-width:none;
    white-space:nowrap;


    font-family:'Caveat', cursive;
    font-weight:400;

    font-size:clamp(3rem, 7vw, 6rem);
    line-height:0.8;

    color:#000000;

    z-index:2;

    text-shadow:none;
}

  /* ---------- Intro ---------- */
  .intro{
    text-align:center;
    padding: clamp(2.5rem, 6vw, 4rem) 1.5rem 3.5rem;
    max-width:640px;
    margin:0 auto;
  }

  .intro h1{
    font-family:'Courier Prime', serif;
    font-weight:600;
    font-size:clamp(2rem, 5vw, 2.8rem);
    margin:0 0 0.6rem;
    letter-spacing:0.01em;
  }

  .intro p{
    color:var(--ink-soft);
    font-size:1.02rem;
    line-height:1.6;
    margin:0 0 1.8rem;
  }

  .cta-row{
    display:flex;
    justify-content:center;
    gap:1rem;
    flex-wrap:wrap;
  }

  .cta{
  display:inline-block;
  padding:0.7rem 1.5rem;
  border:1px solid #000000;
  background:transparent;
  color:#000000;
  text-decoration:none;
  font-size:0.85rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  transition:background 0.2s ease, color 0.2s ease;
}

.cta:hover{
  background:#000000;
  color:#ffffff;
}
  .cta.primary:hover{ background:var(--ochre); border-color:var(--ochre); }
  .cta:not(.primary):hover{ background:var(--ink); color:var(--paper); }

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding: 2rem clamp(1.2rem, 4vw, 3rem);
    display:flex;
    flex-wrap:wrap;
    gap:0.6rem 2rem;
    justify-content:space-between;
    font-size:0.82rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  footer a{ text-decoration:none; }
  footer a:hover{ color:var(--ochre); }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px){
    header{ flex-wrap:wrap; gap:0.9rem; }
    nav{ gap:1rem; flex-wrap:wrap; }
    .hero{ height:58vh; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    nav a::after{ transition:none; }
  }
</style>
</head>
<body>

  <header>
    <a class="wordmark" href="/ArtPortfolio/index.html">George <span>Denver</span></a>
   <nav>
      <a href="/ArtPortfolio/gallery.html">Gallery</a>
      <a href="/ArtPortfolio/commissions.html">Commissions</a>
      <a href="/ArtPortfolio/contact.html">Contact</a>

      <a class="instagram-icon" href="#" aria-label="Instagram">
       <svg viewBox="0 0 24 24" aria-hidden="true">
         <rect x="3" y="3" width="18" height="18" rx="5"></rect>
         <circle cx="12" cy="12" r="4"></circle>
         <circle cx="17.5" cy="6.5" r="1" fill="#000000" stroke="none"></circle>
       </svg>
      </a>
     </nav>
  </header>

  <div class="hero">
  <p class="hero-caption">
    From<br>
    the studio
  </p>
</div>


  <section class="intro">
    <h1>GEORGE DENVER</h1>
    <p>Painter based in Kent, UK. Creating original artwork exploring landscape, light, and colour — available to view, buy, or commission.</p>
    <div class="cta-row">
      <a class="cta primary" href="/ArtPortfolio/gallery.html">View Gallery</a>
      <a class="cta" href="/ArtPortfolio/commissions.html">Commission a Piece</a>
    </div>
  </section>

  <footer>
    <span>Kent, United Kingdom</span>
    <a href="mailto:hello@georgedenver.art">hello@georgedenver.art</a>
  </footer>

</body>
</html>
